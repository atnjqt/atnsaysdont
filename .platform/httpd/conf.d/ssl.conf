LoadModule ssl_module modules/mod_ssl.so

Listen 443

<VirtualHost *:443>
    ############
    # SSL Configuration
    ############
    # - https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/configuring-https-endtoend.html
    # AWS ALB will accept self-signed certs from EC2 instances
    # Two self-signed certs are generated via .platform/hooks/prebuild/01_generate_self_signed_certs.sh
    # Sample virtual host on :443 given Shibboleth SP handlerSSL=True

    SSLEngine             on
    SSLCertificateFile    "/etc/pki/tls/certs/apache_ssl.crt"
    SSLCertificateKeyFile "/etc/pki/tls/private/apache_ssl.key"
    SSLCipherSuite        EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH
    SSLProtocol           All -SSLv2 -SSLv3
    SSLHonorCipherOrder   On
    SSLSessionTickets     Off

    ############
    # Reverse Proxy Configuration
    ############
    # See steps here: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/https-singleinstance-php.html
    
    ProxyPass / http://localhost:5000/ retry=0
    ProxyPassReverse / http://localhost:5000/
    ProxyPreserveHost on
    RequestHeader set X-Forwarded-Proto "https" early
    <Proxy *>
        Order deny,allow
        Allow from all
    </Proxy>
    Header always set Strict-Transport-Security "max-age=63072000; includeSubdomains; preload"
    Header always set X-Frame-Options DENY
    Header always set X-Content-Type-Options nosniff

    ############
    # Shibboleth SP Configuration
    # These are general, encouraged that you do a form.type.ssl.conf corresponding to your reverse proxied endpoint as it'll need custom AuthZ
    ############
    # - https://wiki.shibboleth.net/confluence/display/SHIB2/NativeSPApacheConfig
    # - https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/https-singleinstance.html
    # Restrict locations using Shibboleth authenticated sessions.
    # Should really restrict to a /login that redirects back to app, 
    # then app logic restricts access based on headers to avoid requesting IDP on each page refresh
    
    <Location /Shibboleth.sso>
        AuthType None
        Require all granted
    </Location>

    <Location />
        AuthType shibboleth
        ShibRequestSetting requireSession true
        Require shib-session
        ShibUseHeaders on
    </Location>

</VirtualHost>
